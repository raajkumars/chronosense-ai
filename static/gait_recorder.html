<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: transparent; }
.container { max-width: 640px; margin: 0 auto; }
.video-preview { width: 100%; border-radius: 8px; background: #000; min-height: 240px; }
.btn-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
button { padding: 10px 20px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; font-weight: 600; }
.btn-record { background: #ef4444; color: white; }
.btn-stop { background: #374151; color: white; }
.btn-submit { background: #6366f1; color: white; }
.btn-retake { background: #9ca3af; color: white; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
.status { margin-top: 8px; font-size: 13px; color: #6b7280; }
.recording-indicator { display: inline-block; width: 10px; height: 10px; background: #ef4444; border-radius: 50%; margin-right: 6px; animation: pulse 1s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.timer { font-size: 24px; font-weight: 700; text-align: center; margin: 8px 0; }
</style>
</head>
<body>
<div class="container">
  <video id="preview" class="video-preview" autoplay muted playsinline></video>
  <div class="timer" id="timer">00:00</div>
  <div class="btn-row">
    <button id="btnRecord" class="btn-record" onclick="startRecording()">🔴 Record</button>
    <button id="btnStop" class="btn-stop" onclick="stopRecording()" disabled>⏹ Stop</button>
    <button id="btnSubmit" class="btn-submit" onclick="submitVideo()" disabled>✅ Submit</button>
    <button id="btnRetake" class="btn-retake" onclick="retake()" disabled>🔄 Retake</button>
  </div>
  <div class="status" id="status">Click Record to start camera</div>
</div>

<script>
let mediaRecorder = null;
let recordedChunks = [];
let stream = null;
let timerInterval = null;
let seconds = 0;
let recordedBlob = null;

async function startRecording() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false
    });
    document.getElementById('preview').srcObject = stream;

    recordedChunks = [];
    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
      ? 'video/webm;codecs=vp9'
      : MediaRecorder.isTypeSupported('video/webm')
        ? 'video/webm'
        : 'video/mp4';

    mediaRecorder = new MediaRecorder(stream, { mimeType });
    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = () => {
      recordedBlob = new Blob(recordedChunks, { type: mimeType });
      document.getElementById('preview').srcObject = null;
      document.getElementById('preview').src = URL.createObjectURL(recordedBlob);
      document.getElementById('btnSubmit').disabled = false;
      document.getElementById('btnRetake').disabled = false;
      document.getElementById('btnRecord').disabled = false;
      document.getElementById('btnStop').disabled = true;
      document.getElementById('status').textContent = `Recording ready (${(recordedBlob.size / 1024 / 1024).toFixed(1)} MB) — click Submit to analyze`;
    };

    mediaRecorder.start(100);
    seconds = 0;
    timerInterval = setInterval(() => {
      seconds++;
      const m = String(Math.floor(seconds / 60)).padStart(2, '0');
      const s = String(seconds % 60).padStart(2, '0');
      document.getElementById('timer').textContent = `${m}:${s}`;
      if (seconds >= 15) stopRecording();
    }, 1000);

    document.getElementById('btnRecord').disabled = true;
    document.getElementById('btnStop').disabled = false;
    document.getElementById('status').innerHTML = '<span class="recording-indicator"></span>Recording... Walk across the frame!';
  } catch (err) {
    document.getElementById('status').textContent = 'Camera error: ' + err.message;
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }
  clearInterval(timerInterval);
}

function retake() {
  recordedBlob = null;
  document.getElementById('preview').src = '';
  document.getElementById('btnSubmit').disabled = true;
  document.getElementById('btnRetake').disabled = true;
  document.getElementById('btnRecord').disabled = false;
  document.getElementById('timer').textContent = '00:00';
  document.getElementById('status').textContent = 'Click Record to start camera';
}

function submitVideo() {
  if (!recordedBlob) return;
  const reader = new FileReader();
  reader.onloadend = () => {
    const base64 = reader.result.split(',')[1];
    window.parent.postMessage({
      type: 'streamlit:setComponentValue',
      value: {
        data: base64,
        mimeType: recordedBlob.type,
        size: recordedBlob.size
      }
    }, '*');
    document.getElementById('status').textContent = '✅ Video sent for analysis...';
  };
  reader.readAsDataURL(recordedBlob);
}
</script>
</body>
</html>
